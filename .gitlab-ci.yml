stages:
  - validate
  - test
  - deploy

validate-architecture:
  stage: validate
  tags:
    - msg
  script:
    - python3 scripts/check-architecture.py
  only:
    - branches
    - merge_requests

deploy:
  stage: deploy
  tags:
    - msg
  variables:
    # имя compose-проекта фиксируем = текущему (по папке messenger),
    # иначе runner создал бы новые тома -> потеря БД
    COMPOSE_PROJECT_NAME: messenger
  script:
    - cp "$ENV_FILE" .env
    - docker compose build web api
    - docker compose up -d web api
  only:
    - main

test-dotnet:
  stage: test
  tags:
    - msg
  script:
    # The runner already uses Docker for deployment. Run the SDK in a container
    # and expose the host Docker socket so Testcontainers can start PostgreSQL/Redis.
    - docker run --rm --network host -v "$CI_PROJECT_DIR:/src" -v /var/run/docker.sock:/var/run/docker.sock -w /src mcr.microsoft.com/dotnet/sdk:10.0 dotnet test Messenger.sln --configuration Release
  only:
    - branches
    - merge_requests
