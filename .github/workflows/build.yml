name: Сборка решения

on:
  push:
    branches:
      - refactor/architecture
  pull_request:
    branches:
      - refactor/architecture
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Восстановление и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить .NET SDK 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Проверить версию SDK
        run: dotnet --info

      - name: Восстановить зависимости
        run: dotnet restore Messenger.sln

      - name: Собрать решение
        run: dotnet build Messenger.sln --configuration Release --no-restore

      - name: Запустить тесты
        run: dotnet test Messenger.sln --configuration Release --no-build --verbosity normal
