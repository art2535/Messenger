name: .NET

on:
  push:
    branches:
      - feature/global-refactoring
  pull_request:
    branches:
      - feature/global-refactoring

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Восстановить зависимости
        run: dotnet restore Messenger.sln

      - name: Собрать решение и запустить тесты
        run: dotnet test Messenger.sln --no-restore --configuration Release
