services:
  prometheus:
    image: prom/prometheus:latest
    container_name: messenger-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring_net
    depends_on:
      - redis-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: messenger-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring_net
    depends_on:
      - prometheus
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: messenger-redis-exporter
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis://host.docker.internal:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring_net
    restart: unless-stopped

  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter:latest
    container_name: messenger-rabbitmq-exporter
    ports:
      - "9419:9419"
    environment:
      RABBIT_URL: http://host.docker.internal:15672
      RABBIT_USER: guest
      RABBIT_PASSWORD: guest
      PUBLISH_PORT: "9419"
      RABBIT_CAPABILITIES: bert,no_sort
      RABBIT_EXPORTERS: exchange,node,overview,queue
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - monitoring_net
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  monitoring_net:
    driver: bridge